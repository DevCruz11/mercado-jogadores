services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
      POSTGRES_DB: mercado_jogadores
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado -d mercado_jogadores"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://mercado:mercado@db:5432/mercado_jogadores?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    profiles: ["app"]
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
